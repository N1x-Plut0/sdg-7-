<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Neucha&family=Patrick+Hand&display=swap">
<style>
/* Layout: one wide game screen (canvas + menu overlays), arrow pad under it, then short explainer cards.
   Styled after the "SDG 7 Affordable and clean energy" deck: cream paper, colored pencil, indigo handwriting. */
@font-face {
  font-family: "Biro Script Plus";
  src: local("Biro Script Plus"), local("BiroScriptPlus-Regular"), url("assets/fonts/BiroScriptPlus.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Linotype Feltpen";
  src: local("Linotype Feltpen"), local("LinotypeFeltpen-Regular"), local("Feltpen"), url("assets/fonts/LinotypeFeltpen.woff2") format("woff2");
  font-display: swap;
}
:root {
  --paper: #f8f4d9;
  --paper-2: #f1ebc4;
  --indigo: #5b6496;
  --indigo-deep: #3d4470;
  --green: #427f12;
  --yellow: #fdca39;
  --orange: #ff4401;
  --brown: #b1741e;
  --font-display: "Biro Script Plus", "Caveat", "Segoe Print", cursive;
  --font-body: "Linotype Feltpen", "Patrick Hand", "Neucha", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--indigo); font: 19px/1.35 var(--font-body); padding: 16px 16px 40px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 14px; }
.rough { border: 2px solid var(--indigo); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }

header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 16px; }
h1 { font: 400 clamp(40px, 7vw, 64px)/.95 var(--font-display); margin: 0; }
h1 span { color: var(--green); }
h1 img { width: .4em; vertical-align: top; margin-left: .1em; }
.tag { color: var(--green); font-size: 18px; }

.game { position: relative; width: 100%; height: 0; padding-top: 56.25%; max-width: 100%; background: var(--paper); overflow: hidden; touch-action: manipulation; }
.game > canvas { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; }
.hudbtns { position: absolute; top: 8px; right: 10px; display: flex; gap: 6px; z-index: 2; }
.hudbtns button { width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; background: var(--paper); border: 2px solid var(--indigo); border-radius: 12px 4px 12px 4px; font-size: 18px; }

.screen {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; overflow: auto; padding: 18px 22px;
  background: rgba(248, 244, 217, .9); display: grid; align-content: start; gap: 12px;
}
@media (max-width: 700px) { .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: calc(18px + env(safe-area-inset-top, 0px)); background: rgba(248, 244, 217, .97); } }
.screen h2 { font: 400 clamp(34px, 5.5vw, 52px)/1 var(--font-display); margin: 0; text-wrap: balance; }
.screen h3 { font: 400 26px/1 var(--font-display); margin: 0; }
.screen p { margin: 0; max-width: 60ch; }
.screen .sub { color: var(--green); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: 400 26px/1.05 var(--font-display); padding: 8px 18px 10px; cursor: pointer; background: var(--yellow); color: var(--indigo);
  border: 2.5px solid var(--indigo); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; box-shadow: 3px 4px 0 var(--indigo);
}
.btn.alt { background: var(--paper); }
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--indigo); }
.btn:focus-visible, .card:focus-visible, .key:focus-visible, .hudbtns button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.menu-title { font: 400 clamp(54px, 10vw, 96px)/.9 var(--font-display); margin: 4px 0 0; }
.menu-title span { color: var(--green); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  text-align: left; cursor: pointer; background: var(--paper); padding: 10px 14px 12px; display: grid; gap: 4px;
  border: 2px solid var(--indigo); border-radius: 14px 5px 16px 4px / 5px 16px 4px 14px;
}
.card .k { font-size: 15px; color: var(--orange); }
.card .n { font: 400 26px/1 var(--font-display); }
.card .d { font-size: 16px; color: var(--green); }
.card .st { font-size: 16px; }
.card.locked { opacity: .55; cursor: not-allowed; }
.card[aria-pressed="true"] { background: #fff3c4; border: 2.5px solid var(--orange); }
.card canvas { width: 70px; height: 84px; justify-self: center; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ach div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 10px; border: 1.5px dashed rgba(91,100,150,.5); border-radius: 10px 4px 12px 4px; font-size: 16px; }
.ach div.got { border-style: solid; border-color: var(--green); background: #f3f6dc; }
.ach img { width: 30px; }
.ach div:not(.got) img { filter: grayscale(1) opacity(.35); }
.ach b { display: block; font: 400 21px/1 var(--font-display); }
.fact { background: #fff; padding: 10px 14px; border: 2px solid var(--green); border-radius: 16px 16px 16px 4px; color: var(--green); }
.fact b { font: 400 20px var(--font-display); color: var(--orange); display: block; }
.fact.locked { color: var(--indigo); opacity: .6; border-style: dashed; }
.tgts, .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.tgt { padding: 8px 12px; border: 2px solid var(--indigo); border-radius: 12px 4px 14px 4px; background: #fff; font-size: 16px; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-width: 560px; counter-reset: none; }
.board li { display: grid; grid-template-columns: 34px 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 10px; background: #fff; border: 1.5px solid rgba(91,100,150,.4); border-radius: 10px 4px 12px 4px; font-size: 18px; }
.board li.me { border: 2.5px solid var(--orange); background: #fff3c4; }
.board .rk { font: 400 24px/1 var(--font-display); color: var(--green); text-align: center; }
.board .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--indigo); }
.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .sc { font-variant-numeric: tabular-nums; color: var(--indigo); }
.board li:nth-child(1) .rk { color: var(--orange); }
input.nick { font: 22px var(--font-body); color: var(--indigo); padding: 8px 12px; min-width: 0; width: 240px; max-width: 100%; background: #fff; border: 2px solid var(--indigo); border-radius: 12px 4px 12px 4px; }
input.nick:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.quests { display: grid; gap: 10px; max-width: 620px; }
.quest { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 12px; align-items: center; padding: 8px 12px; background: #fff; border: 2px solid var(--indigo); border-radius: 12px 4px 14px 4px; font-size: 18px; }
.quest.done { border-color: var(--green); background: #f3f6dc; }
.quest .qbar { height: 12px; border: 1.5px solid var(--indigo); border-radius: 8px 3px 8px 3px; overflow: hidden; }
.quest .qbar i { display: block; height: 100%; background: var(--green); }
.quest .qp { font-variant-numeric: tabular-nums; color: var(--green); }
@media (max-width: 520px) { .quest { grid-template-columns: minmax(0, 1fr) auto; } .quest .qbar { grid-column: 1 / -1; } }
.tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.tblwrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; background: #fff; font-size: 16px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 5px 10px; border-bottom: 1.5px dashed rgba(91,100,150,.35); text-align: left; }
.tbl thead th { font: 400 20px var(--font-display); color: var(--green); border-bottom: 2px solid var(--indigo); }
.tbl tbody th { font-weight: 400; color: var(--indigo); }
.tbl td { color: var(--green); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; padding: 4px 10px; cursor: pointer; background: var(--paper); color: var(--indigo); border: 2px solid var(--indigo); border-radius: 12px 4px 12px 4px; font: 18px var(--font-body); }
.chip:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.lvpick { gap: 6px; }
.lvpick .chip { min-width: 36px; justify-content: center; }
.lvpick .chip.on { background: var(--yellow); }
.cwrap { display: grid; gap: 6px; }
.cwrap .chip { justify-self: center; }
.card.newc { justify-items: center; align-content: center; border-style: dashed; min-height: 150px; }
.card .plus { font: 400 54px/1 var(--font-display); color: var(--green); }
.editor { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 620px) { .editor { grid-template-columns: minmax(0, 1fr); } }
.prevcol { display: grid; gap: 8px; justify-items: center; }
.editor canvas { width: 180px; height: 230px; justify-self: center; background: #fff; border: 2px solid var(--indigo); border-radius: 16px 6px 16px 6px; }
.edctl { display: grid; gap: 8px; }
.edctl h4 { margin: 4px 0 0; font: 400 20px var(--font-display); color: var(--green); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--indigo); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--orange); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--yellow); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.edui { display: grid; gap: 8px; }
.edui .row { gap: 6px; }
.edui select, .edui input.nick { font: 18px var(--font-body); color: var(--indigo); padding: 5px 8px; border: 2px solid var(--indigo); border-radius: 10px 4px 10px 4px; background: #fff; max-width: 100%; }
.edui input[type=range] { width: 100%; accent-color: var(--green); }
.edui .btn { font-size: 22px; padding: 5px 14px 7px; }
.tools-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lvrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 8px 12px; background: #fff; border: 2px solid var(--indigo); border-radius: 12px 4px 14px 4px; }
.lvrow .nm { font: 400 24px/1.1 var(--font-display); overflow-wrap: anywhere; }
.lvrow .d { font-size: 15px; color: var(--green); display: block; }
.mylv { display: grid; gap: 8px; max-width: 720px; }
textarea.code { width: 100%; min-height: 70px; font: 14px ui-monospace, Menlo, monospace; color: var(--indigo); border: 2px solid var(--indigo); border-radius: 10px; padding: 8px; overflow-wrap: anywhere; }
.accgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 760px; }
.accform { display: grid; gap: 8px; align-content: start; padding: 12px 14px; background: #fff; border: 2px solid var(--indigo); border-radius: 14px 5px 16px 4px; }
.accform h3 { margin: 0; }
.accform label { display: grid; gap: 2px; font-size: 17px; }
.accform .hint { font-size: 14px; color: var(--green); }
.accform .btn { justify-self: start; }
.tgt b { display: block; font: 400 22px/1.1 var(--font-display); color: var(--green); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 20px; }
.stats b { color: var(--green); font-weight: 400; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 17px; max-width: 520px; }
.keys kbd { display: inline-block; min-width: 30px; text-align: center; border: 2px solid var(--indigo); border-radius: 6px 3px 7px 3px; padding: 0 6px; margin-right: 6px; font-family: var(--font-body); background: #fff; }

.toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 6; background: var(--yellow); padding: 6px 16px 8px; font: 400 22px/1.1 var(--font-display); box-shadow: 3px 4px 0 var(--indigo); text-align: center; pointer-events: none; animation: tin .35s cubic-bezier(.3,1.5,.5,1); max-width: 90%; }
.toast small { display: block; font: 15px var(--font-body); }
@keyframes tin { from { transform: translateX(-50%) scale(.5); opacity: 0; } }

.pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; user-select: none; -webkit-user-select: none; }
.key {
  touch-action: none; cursor: pointer; display: grid; justify-items: center; gap: 0; padding: 6px 4px 8px; background: var(--paper);
  border: 2.5px solid var(--indigo); border-radius: 18px 6px 18px 6px / 6px 18px 6px 18px; box-shadow: 3px 4px 0 var(--indigo);
}
.key .a { font: 400 34px/1 var(--font-body); }
.key .l { font-size: 15px; color: var(--green); }
.key.on { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--indigo); background: #fff3c4; }
.key.up { background: var(--yellow); }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.info section { padding: 12px 16px; }
.info h2 { font: 400 30px/1 var(--font-display); margin: 0 0 6px; }
.info p { margin: 0 0 6px; font-size: 17px; }
.info a { color: var(--green); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Light <span>Dash</span><img src="assets/star-yellow.png" alt=""></h1>
    <span class="tag" data-t="tagline"></span>
  </header>

  <div class="game rough" id="game">
    <canvas id="cv" aria-label="Light Dash"></canvas>
    <div class="hudbtns">
      <button type="button" id="bPause" aria-label="Pause">II</button>
      <button type="button" id="bSound" aria-label="Sound effects">♪</button>
      <button type="button" id="bMusic" aria-label="Music">♫</button>
    </div>
    <div class="screen" id="screen"></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <div class="edui" id="edUI" hidden></div>

  <div class="pad" id="pad">
    <button type="button" class="key" data-k="left"><span class="a">←</span><span class="l" data-t="kLeft"></span></button>
    <button type="button" class="key" data-k="down"><span class="a">↓</span><span class="l" data-t="kDown"></span></button>
    <button type="button" class="key up" data-k="up"><span class="a">↑</span><span class="l" data-t="kUp"></span></button>
    <button type="button" class="key" data-k="right"><span class="a">→</span><span class="l" data-t="kRight"></span></button>
  </div>

  <div class="info">
    <section class="rough"><h2 data-t="whatTitle"></h2><p data-t="what1"></p><p data-t="what2"></p></section>
    <section class="rough"><h2 data-t="howTitle"></h2><p data-t="how1"></p><p data-t="how2"></p></section>
    <section class="rough"><h2 data-t="moreTitle"></h2><p data-t="more1"></p><p><a href="valley.html" data-t="moreLink"></a></p></section>
  </div>
</div>

<script src="leaderboard-config.js"></script>

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.max(0, Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2));
    this.moveTo(x + r, y); this.lineTo(x + w - r, y); this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r); this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h); this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r); this.quadraticCurveTo(x, y, x + r, y); this.closePath();
  };
}
window.addEventListener('error', e => {
  const sc = document.getElementById('screen');

/* Endless: append random patterns ahead of the runner */
function endlessBuilder() {
  const b = new Builder(320); b.len = Infinity; b.n = 0;
  b.more = function () {
    const v = this.v; this.D = (2 * JUMP / GRAV) * v;
    const g = () => Math.round(v * 0.95 + Math.random() * 120);
    const r = Math.random();
    this.n++;
    if (this.n % 5 === 0) { this.energy(3).gap(120).house().gap(g()); return; }
    if (r < .16) this.spikes(1 + Math.floor(Math.random() * 3)).gap(g());
    else if (r < .28) this.energy(3).gap(g());
    else if (r < .38) this.pit(130 + Math.floor(Math.random() * 50)).gap(g());
    else if (r < .48) { this.block(280, 45 + Math.floor(Math.random() * 30)).gap(0).spikes(2).gap(g()); }
    else if (r < .58) this.cloud(110 + Math.floor(Math.random() * 30)).gap(g());
    else if (r < .66) { this.energy(2).gap(100).wall().gap(g()); }
    else if (r < .74) { this.pad().gap(40).spikes(4).gap(g()); }
    else if (r < .82) { this.pit(300); this.o.push({ t: 'orb', x: this.x - 300 + 115, y: G - 150, r: 18 }); this.gap(g()); }
    else if (r < .9) { this.block(210, 45).block(210, 90).gap(0).spikes(2).gap(g()); }
    else if (r < .93) { this.gustPit(420).gap(g()); }
    else if (r < .96) { this.portal(.8).gap(240).spikes(1).gap(230).spikes(1).gap(260).portal(1).gap(g()); }
    else { this.spikes(2).gap(Math.round(v * .8)).spikes(2).gap(g()); }
  };
  return b;
}

let lvl, B, run, endless = false;
const input = { up: false, down: false, jumpBuf: 0, light: false, dash: false };

function newRun(fromCheckpoint) {
  const cp = fromCheckpoint && run && run.cp;
  if (!cp) {
    if (endless) { B = endlessBuilder(); for (let i = 0; i < 6; i++) B.more(); lvl = { idx: -1, speed: 320, objs: B.o, groups: B.groups, len: Infinity, houses: 0 }; }
    else lvl = lvl.custom ? buildCustom(lvl.custom) : buildLevel(lvl.idx);
  }
  const attempt = run ? run.attempt + 1 : 1;
  const base = cp ? cp.snap : { x: 0, energy: 0, lit: [], facts: [], broken: [] };
  for (const o of lvl.objs) { o.lit = base.lit.includes(o); o.got = base.facts.includes(o) || (o.t === 'energy' && o.x < base.x); o.broken = base.broken.includes(o); o.used = o.t === 'portal' ? o.x < base.x : false; o.rode = false; }
  run = {
    p: { x: base.x, y: G, vy: 0, ground: true, slideT: 0, dash: 0, dashCd: 0, alive: true, ang: 0 },
    energy: base.energy, time: 0, deadT: 0, attempt, cp: cp || null, fresh: !cp, deaths: run && run.sameLevel ? run.deaths : 0,
    sameLevel: true, particles: [], flash: '', flashT: 0, done: false, speed: base.speed || lvl.speed, startX: base.x, wallsBroken: 0,
  };
}

const litCount = () => lvl.objs.filter(o => o.t === 'house' && o.lit).length;
const housesSoFar = () => lvl.objs.filter(o => o.t === 'house' && o.x < run.p.x + 200).length;

function snapshot() {
  return { x: run.p.x, energy: run.energy, lit: lvl.objs.filter(o => o.lit), facts: lvl.objs.filter(o => o.t === 'fact' && o.got), broken: lvl.objs.filter(o => o.broken), speed: run.speed };
}

function die() {
  const p = run.p; if (!p.alive) return;
  p.alive = false; run.deadT = 0; run.deaths++;
  if (!demo) { bump('attempts'); persist(); checkAch(); }
  for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 320; run.particles.push({ x: p.x, y: p.y - 26, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: .8, c: ['#5b6496', '#fdca39', '#ff4401', '#427f12'][i % 4], r: 3 + Math.random() * 4 }); }
  sfx('die');
}

function flash(msg) { run.flash = msg; run.flashT = 1.4; }

function step(dt, bot) {
  const p = run.p;
  if (!p.alive) return;
  if (endless) {
    run.speed = Math.min(440, 320 + p.x / 400); B.v = run.speed;
    while (B.x < p.x + 1800) B.more();
    if (lvl.objs.length > 400) { lvl.objs = lvl.objs.filter(o => o.x > p.x - 600); B.o = lvl.objs; B.groups = B.groups.filter(g => g.b > p.x - 600); lvl.groups = B.groups; }
  }
  const v = run.speed;
  run.time += dt;
  const inp = bot ? bot : input;

  p.x += v * dt;
  p.dash = Math.max(0, p.dash - dt); p.dashCd = Math.max(0, p.dashCd - dt); p.slideT = Math.max(0, p.slideT - dt);

  // dash (right arrow)
  if (inp.dash) {
    inp.dash = false;
    if (run.energy > 0 && p.dashCd <= 0) { run.energy--; p.dash = .45; p.dashCd = .55; sfx('dash'); }
    else if (run.energy <= 0) flash(t('noEnergy'));
  }
  // light a home (left arrow)
  if (inp.light) {
    inp.light = false;
    const h = lvl.objs.find(o => o.t === 'house' && !o.lit && Math.abs(o.x + 45 - p.x) < 140);
    if (h) {
      if (run.energy > 0) {
        run.energy--; h.lit = true; bump('houses'); sfx('light');

/* =========================================================
   Autopilot (demo on the menu, and level testing)
   ========================================================= */
function autopilot() {
  const p = run.p, v = run.speed, D = (2 * JUMP / GRAV) * v, front = p.x + PW / 2;
  const a = { up: false, down: false, jumpBuf: 0, light: false, dash: false };
  for (const o of lvl.objs) {
    if (o.x > p.x + 400) break;
    if (o.t === 'house' && !o.lit && run.energy > 1 && Math.abs(o.x + 45 - p.x) < 120) a.light = true;
    if ((o.t === 'wall') && !o.broken && o.x - front < v * 0.05 + 4 && o.x + o.w > p.x - 14) a.dash = p.dashCd <= 0 && p.dash <= 0;
    if (o.t === 'cloud' && !o.broken && o.x - front < v * 0.09 && o.x + o.w > p.x - PW) a.down = true;
    if (o.t === 'orb' && !o.used && !p.ground && Math.abs(o.x - p.x) < 14) a.jumpBuf = .05;
  }
  if (p.ground) {
    for (const g of lvl.groups) {
      if (g.b < p.x - 14) continue;
      if (g.a > p.x + 400) break;
      if (g.kind === 'step') {
        if (g.top < p.y - 4) { const rise = p.y - g.top; const lead = v * (0.08 + rise / 520); if (g.a - front < lead && g.a - front > -4) a.up = true; }
        continue;
      }
      if (g.base !== G && p.y !== g.base) continue;
      const fall = Math.max(0, g.base - p.y); // jumping from a higher block lands later
      const air = (JUMP + Math.sqrt(JUMP * JUMP + 2 * GRAV * fall)) / GRAV * v;
      const T = Math.min((g.a + g.b) / 2 - (fall > 0 ? air * .45 : D / 2), g.a - 30);
      if (p.x >= T - 2 && p.x < g.a - 2) { a.up = true; break; }
    }
    // hop up for a fact star floating above the path
    for (const o of lvl.objs) {
      if (o.t !== 'fact' || o.got) continue;
      const dx = o.x - p.x, rise = p.y - o.y;
      if (dx > D * .42 - 12 && dx < D * .42 + 12 && rise > 40 && rise < 175) a.up = true;
      if (dx > 400) break;
    }
    // walking off a block straight onto spikes: jump from the block edge
    for (const o of lvl.objs) {
      if (o.t === 'block' && p.y === o.top && o.top < G) {
        const edge = o.x + o.w;
        const after = lvl.groups.find(g => g.a >= edge - 1 && g.a < edge + 60 && g.kind === 'hop');
        if (after && p.x > edge - 34 && p.x < edge - 4) a.up = true;
      }
    }
  }
  return a;
}

let ac = null;
function sfx(kind) {
  if (save.mute || demo) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    const set = { jump: [520, 760, .09, 'square', .05], orb: [700, 1100, .12, 'square', .05], pad: [300, 900, .2, 'square', .05], coin: [880, 1320, .08, 'triangle', .08],
      star: [660, 1760, .35, 'triangle', .1], light: [440, 880, .3, 'triangle', .1], dash: [200, 600, .15, 'sawtooth', .04], smash: [160, 60, .2, 'sawtooth', .06],
      die: [300, 70, .35, 'sawtooth', .07], land: [140, 100, .04, 'triangle', .03], win: [523, 1046, .6, 'triangle', .1] }[kind];
    if (!set) return;
    o.type = set[3]; o.frequency.setValueAtTime(set[0], n); o.frequency.exponentialRampToValueAtTime(set[1], n + set[2]);
    g.gain.setValueAtTime(set[4], n); g.gain.exponentialRampToValueAtTime(.0001, n + set[2] + .05);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + set[2] + .06);
  } catch (e) {}
}

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayBefore = day => { const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); };
function todaysQuests(day) {
  let h = 0; for (const ch of day) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const pool = QUESTS.slice(), out = [];
  while (out.length < 3) { h = (h * 1103515245 + 12345) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); }
  return out;
}
function dailyState() {
  const d = today();
  if (!save.daily || save.daily.day !== d) save.daily = { day: d, c: {}, done: [], streak: (save.daily && save.daily.streak) || 0, lastFull: save.daily && save.daily.lastFull };
  return save.daily;
}
const questProgress = q => Math.min(q.n, dailyState().c[q.key] || 0);
const questsLeft = () => todaysQuests(dailyState().day).filter(q => !dailyState().done.includes(q.id)).length;
function checkQuests() {
  const st = dailyState(), list = todaysQuests(st.day);
  for (const q of list) {
    if (st.done.includes(q.id) || questProgress(q) < q.n) continue;
    st.done.push(q.id); save.stats.quests = (save.stats.quests || 0) + 1;
    toast(t('questDone'), q[save.lang]);
    if (st.done.length === list.length) { st.streak = st.lastFull === dayBefore(st.day) ? (st.streak || 0) + 1 : 1; st.lastFull = st.day; }
    persist(); checkAch(); pushSoon();
  }
}
// Count something the player did, for lifetime stats and today's quests.
function bump(key, n = 1) {
  if (demo || (lvl && lvl.custom)) return;
  save.stats[key] = (save.stats[key] || 0) + n;
  const st = dailyState(); st.c[key] = (st.c[key] || 0) + n;
  checkQuests();
}
function bumpMax(key, v) {
  if (demo || (lvl && lvl.custom)) return;
  const st = dailyState(); st.c[key] = Math.max(st.c[key] || 0, v);
  checkQuests();
}

  show(`<h2>${t('nick')}</h2><p>${t('nickSub')}</p>

// a slightly darker version of a colour, for the far arm and leg
function shade(hex) {
  const n = parseInt(String(hex).slice(1), 16); if (isNaN(n)) return hex;
  const f = v => Math.max(0, Math.round(v * .78));
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}

const ED_TOOLS = {

  check:  { w: 24,  soft: true, add: b => b.check() },
};
const ED_SPEEDS = [300, 340, 380, 420];
const ED_START = 400, ED_MAX_ITEMS = 250, ED_MAX_X = 60000;
const ED = { L: null, idx: -1, tool: 'spike', cam: 0, hover: null, down: null, fromEditor: false };

function buildCustom(L) {
  const b = new Builder(L.speed || 340);
  const items = L.items.slice().sort((a, c) => a[1] - c[1]);
  let end = 1500;
  for (const [k, x] of items) { const tl = ED_TOOLS[k]; if (!tl) continue; b.x = x; tl.add(b); end = Math.max(end, x + tl.w + 400); }
  b.x = end; b.finish(100);
  b.o.sort((a, c) => a.x - c.x);
  return { idx: -2, custom: L, speed: L.speed || 340, objs: b.o, groups: b.groups, len: b.len, houses: b.o.filter(o => o.t === 'house').length, D: b.D };
}
const footprint = ([k, x]) => { const tl = ED_TOOLS[k]; return [x - (tl.pre || 0), x + tl.w]; };
function edFree(k, x, skipIdx) {
  const tl = ED_TOOLS[k], [a, b] = footprint([k, x]);
  if (a < ED_START || b > ED_MAX_X) return false;
  return ED.L.items.every((it, i) => {
    if (i === skipIdx) return true;
    const o = ED_TOOLS[it[0]]; if (!!tl.soft !== !!o.soft) return true; // objects in the background never block the track
    if (tl.soft && it[0] !== k) return true;
    const [c, d] = footprint(it); return b <= c || a >= d;
  });
}

// share codes: "LD1." + base64url of a small JSON
const b64u = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
const levelCode = L => 'LD1.' + b64u(JSON.stringify({ n: L.name, t: L.theme, s: L.speed, i: L.items }));
function parseCode(code) {
  try {
    code = String(code).trim();
    const m = code.match(/LD1\.([A-Za-z0-9_-]+)/); if (!m) return null;
    const o = JSON.parse(unb64u(m[1]));
    if (!o || !Array.isArray(o.i) || o.i.length > ED_MAX_ITEMS) return null;
    const items = o.i.filter(it => Array.isArray(it) && ED_TOOLS[it[0]] && Number.isInteger(it[1]) && it[1] >= ED_START && it[1] <= ED_MAX_X).map(it => [it[0], it[1]]);
    if (!items.length) return null;
    return { id: 'l' + Date.now().toString(36), name: String(o.n || t('untitled')).slice(0, 24), theme: Number.isInteger(o.t) && o.t >= 0 && o.t < THEMES.length ? o.t : 0,
      speed: ED_SPEEDS.includes(o.s) ? o.s : 340, items, verified: false };
  } catch (e) { return null; }
}

function playCustom(L, fromEditor) {

function leaveCustom() {
  musicStop();

function completeCustom() {

    ${L.communityId && !L.mine ? `<div class="row"><span>${t('likeIt')}</span><button class="btn alt" id="ccLike">${L.liked ? '♥ ' + t('liked') : '♡ ' + t('like')}</button></div>` : ''}
    <div class="row"><button class="btn alt" id="ccRe">${t('retry')}</button><button class="btn" id="ccBack">${ED.fromEditor ? t('backEditor') : t('myLevels')}</button>${mine ? `<button class="btn alt" id="ccShare">${t('edShare')}</button>` : ''}</div>`);
  on('#ccLike', async e => { const btn = e.currentTarget; if (!save.nick) { toast(t('pubNeedNick')); return; } await pushScore(); const r = await levelsCall({ action: 'like', levelId: L.communityId }); if (r && r.ok) { L.liked = r.liked; btn.textContent = r.liked ? '♥ ' + t('liked') : '♡ ' + t('like'); } });
  on('#ccRe', () => playCustom(L, ED.fromEditor)); on('#ccBack', leaveCustom); on('#ccShare', () => shareLevel(L, leaveCustom));

function simulateCustom(L) {
  const keep = { demo, endless, lvl, run, state };
  demo = true; endless = false; lvl = { custom: L }; run = null; newRun(false);
  let n = 0;
  while (!run.done && run.p.alive && n < 120 * 300) { step(STEP, autopilot()); n++; }
  const res = { done: run.done, pct: Math.floor(Math.min(1, run.p.x / lvl.len) * 100) };
  demo = keep.demo; endless = keep.endless; lvl = keep.lvl; run = keep.run; state = keep.state;
  return res;
}

function edSave(quiet) {
  const L = ED.L;
  if (!L.items.length) return false;
  save.myLevels = save.myLevels || [];
  const i = save.myLevels.findIndex(x => x.id === L.id);
  if (i >= 0) save.myLevels[i] = L;
  else { if (save.myLevels.length >= 8) { edMsg(t('fullLevels')); return false; } save.myLevels.push(L); }
  persist(); unlock('creator');
  if (!quiet) edMsg(t('levelSaved'));
  return true;
}
function edMsg(text) { const m = document.getElementById('edMsg'); if (m) m.textContent = text; }
function edRebuild() {
  lvl = buildCustom(ED.L);
  if (!run) newRun(false);
  run.p.alive = false; run.particles = [];
  const r = document.getElementById('edScroll'); if (r) { r.max = Math.max(0, lvl.len - 300); r.value = ED.cam; }
}

function closeEditor() {
  document.getElementById('edUI').hidden = true; document.getElementById('pad').hidden = false;
  state = 'menu'; startDemo();
}
function edWorldX(e) { const r = cv.getBoundingClientRect(); return ED.cam + (e.clientX - r.left) / r.width * W; }
function edItemAt(wx) {
  let best = -1, bw = Infinity;
  ED.L.items.forEach((it, i) => { const [a, b] = footprint(it); if (wx >= a && wx <= b && b - a < bw) { best = i; bw = b - a; } });
  return best;
}
function edTap(wx) {
  if (ED.tool === 'erase') {
    const i = edItemAt(wx); if (i >= 0) { ED.L.items.splice(i, 1); ED.L.verified = false; edRebuild(); }
    return;
  }
  const tl = ED_TOOLS[ED.tool], x = Math.round((wx - tl.w / 2) / 10) * 10;
  if (x - (tl.pre || 0) < ED_START) return edMsg(t('startZone'));
  if (ED.L.items.length >= ED_MAX_ITEMS || !edFree(ED.tool, x)) return edMsg(t('noSpace'));
  ED.L.items.push([ED.tool, x]); ED.L.verified = false; edMsg(t('edHelp')); edRebuild();
}
function drawEditorMarks(c, cam) {
  c.save();
  c.fillStyle = 'rgba(66,127,18,.12)'; c.fillRect(cam < ED_START ? 0 : cam - 10, 0, Math.max(0, ED_START - Math.max(cam, 0)), G);
  for (let x = Math.floor(cam / 100) * 100; x < cam + W + 100; x += 100) {
    line(c, [[x, G + 4], [x, G + (x % 500 ? 12 : 22)]], 1.5, 'rgba(91,100,150,.6)');
    if (x % 500 === 0) { c.fillStyle = C.indigo; c.font = `14px ${FONT_B}`; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(String(x / 50) + ' m', x, G + 26); }
  }
  if (ED.hover !== null) {
    if (ED.tool === 'erase') {
      const i = edItemAt(ED.hover);
      if (i >= 0) { const [a, b] = footprint(ED.L.items[i]); c.fillStyle = 'rgba(255,68,1,.22)'; c.fillRect(a, 30, b - a, G - 30); }
    } else {
      const tl = ED_TOOLS[ED.tool], x = Math.round((ED.hover - tl.w / 2) / 10) * 10, ok = x - (tl.pre || 0) >= ED_START && edFree(ED.tool, x);
      c.fillStyle = ok ? 'rgba(66,127,18,.25)' : 'rgba(255,68,1,.25)'; c.strokeStyle = ok ? C.green : C.orange; c.lineWidth = 2;
      c.fillRect(x - (tl.pre || 0), 30, tl.w + (tl.pre || 0), G - 30); c.strokeRect(x - (tl.pre || 0), 30, tl.w + (tl.pre || 0), G - 30);
      c.fillStyle = ok ? C.green : C.orange; c.font = `16px ${FONT_B}`; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(t('tools')[ED.tool], x + tl.w / 2, 26);
    }
  }
  c.restore();
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'editor') return;
  e.preventDefault(); ED.down = { x: e.clientX, cam: ED.cam, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (state !== 'editor') return;
  ED.hover = edWorldX(e);
  if (ED.down) {
    const dx = e.clientX - ED.down.x;
    if (Math.abs(dx) > 6) ED.down.moved = true;
    if (ED.down.moved) { const r = cv.getBoundingClientRect(); ED.cam = Math.max(0, Math.min(lvl.len, ED.down.cam - dx / r.width * W)); const s2 = document.getElementById('edScroll'); if (s2) s2.value = ED.cam; }
  }
});
cv.addEventListener('pointerup', e => {
  if (state !== 'editor' || !ED.down) return;
  if (!ED.down.moved) edTap(edWorldX(e));
  ED.down = null;
});
cv.addEventListener('pointerleave', () => { ED.hover = null; });
window.addEventListener('keydown', e => {
  if (state !== 'editor' || (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName))) return;
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault(); ED.cam = Math.max(0, Math.min(lvl.len, ED.cam + (e.code === 'ArrowLeft' ? -200 : 200)));
    const s2 = document.getElementById('edScroll'); if (s2) s2.value = ED.cam;
  }
});

/* =========================================================
   Accounts and cloud saves
   ========================================================= */
const ACC_KEY = 'light-dash-account';
const ACC_URL = LB_URL ? LB_URL.replace(/\/api\/leaderboard$/, '/api/account') : '';
function accountName() { try { const a = JSON.parse(localStorage.getItem(ACC_KEY)); return a && a.username || ''; } catch (e) { return ''; } }
async function accCall(body) {
  if (!ACC_URL) return null;
  try { const r = await fetch(ACC_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); return await r.json(); } catch (e) { return null; }
}
async function cloudSave() {
  if (!accountName() || !ACC_URL) return null;
  const me = lbPlayer();
  const r = await accCall({ action: 'save', id: me.id, key: me.key, data: save });
  if (r && r.ok) { try { localStorage.setItem('light-dash-cloud-at', String(r.updated)); } catch (e) {} }
  return r;
}
// On start: if the account's cloud copy is newer than this device's, use it.
async function cloudSync() {
  if (!accountName() || !ACC_URL) return;
  const me = lbPlayer();
  const r = await accCall({ action: 'load', id: me.id, key: me.key });
  if (!r || !r.ok) return;
  if (r.data && (r.updated || 0) > (save.updatedAt || 0) + 1500) {
    let done = false; try { done = sessionStorage.getItem('ld-synced') === String(r.updated); sessionStorage.setItem('ld-synced', String(r.updated)); } catch (e) {}
    if (done) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign({}, r.data, { updatedAt: r.updated }))); } catch (e) { return; }
    location.reload();
  } else if (!r.data) cloudSave();
}
function accountScreen(msg) {
  state = 'menu';
  const head = `<h2>${t('account')}</h2><p class="sub">${t('accSub')}</p>`;
  if (!ACC_URL) { show(`${head}<div class="fact"><b>${t('accOff')}</b></div><div class="row"><button class="btn alt" id="aBack2">${t('back')}</button></div>`); return on('#aBack2', menu); }
  const name = accountName();
  if (name) {
    let at = 0; try { at = +localStorage.getItem('light-dash-cloud-at') || 0; } catch (e) {}
    show(`${head}<div class="stats"><span>${t('loggedAs')}: <b>${esc(name)}</b></span>${save.nick ? `<span>${t('nick')}: <b>${esc(save.nick)}</b></span>` : ''}
        <span>${t('cloudSaved')}: <b id="accAt">${at ? new Date(at).toLocaleString(save.lang === 'ru' ? 'ru-RU' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' }) : t('never')}</b></span></div>
      <p class="sub" id="accMsg">${msg ? esc(msg) : ''}</p>
      <div class="row"><button class="btn" id="accSave">${t('saveNow')}</button><button class="btn alt" id="accPw">${t('changePass')}</button><button class="btn alt" id="accOut">${t('logout')}</button><button class="btn alt" id="aBack2">${t('back')}</button></div>
      <form id="pwForm" class="accform" hidden autocomplete="off"><label>${t('oldPassword')} <input id="pwOld" class="nick" type="password" maxlength="64"></label>
        <label>${t('newPassword')} <input id="pwNew" class="nick" type="password" maxlength="64"></label><button class="btn" type="submit">${t('save')}</button></form>`);
    on('#aBack2', menu);
    on('#accSave', async () => { const r = await cloudSave(); accountScreen(r && r.ok ? t('saved') : t('accFail')); });
    on('#accPw', () => { screen.querySelector('#pwForm').hidden = false; screen.querySelector('#pwOld').focus(); });
    screen.querySelector('#pwForm').addEventListener('submit', async e => {
      e.preventDefault();
      const me = lbPlayer(), nw = screen.querySelector('#pwNew').value;
      if (nw.length < 6 || nw.length > 64) { screen.querySelector('#accMsg').textContent = t('accBadPass'); return; }
      const r = await accCall({ action: 'password', id: me.id, key: me.key, old: screen.querySelector('#pwOld').value, password: nw });
      accountScreen(r && r.ok ? t('passChanged') : r && r.error === 'wrong_login' ? t('accWrong') : t('accFail'));
    });
    on('#accOut', async e => {
      const b = e.currentTarget;
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = t('logout') + '?'; screen.querySelector('#accMsg').textContent = t('logoutSure'); return; }
      await cloudSave();
      try { for (const k of [ACC_KEY, 'light-dash-player', SAVE_KEY, 'light-dash-cloud-at']) localStorage.removeItem(k); sessionStorage.removeItem('ld-synced'); } catch (err) {}
      location.reload();
    });
    return;
  }
  show(`${head}<p class="sub" id="accMsg">${msg ? esc(msg) : ''}</p>
    <div class="accgrid">
      <form id="regForm" class="accform" autocomplete="off"><h3>${t('register')}</h3>
        <label>${t('username')} <input id="regUser" class="nick" maxlength="16" autocomplete="username"></label><span class="hint">${t('accHintUser')}</span>
        <label>${t('password')} <input id="regPass" class="nick" type="password" maxlength="64" autocomplete="new-password"></label>
        <label>${t('password2')} <input id="regPass2" class="nick" type="password" maxlength="64" autocomplete="new-password"></label><span class="hint">${t('accHintPass')}</span>
        <span class="hint">${t('accRegNote')}</span><button class="btn" type="submit">${t('register')}</button></form>
      <form id="logForm" class="accform"><h3>${t('login')}</h3>
        <label>${t('username')} <input id="logUser" class="nick" maxlength="16" autocomplete="username"></label>
        <label>${t('password')} <input id="logPass" class="nick" type="password" maxlength="64" autocomplete="current-password"></label>
        <span class="hint">${t('accLoginNote')}</span><span class="hint">${t('forgot')}</span><button class="btn" type="submit">${t('login')}</button></form>
    </div>
    <div class="row"><button class="btn alt" id="aBack2">${t('back')}</button></div>`);
  on('#aBack2', menu);
  const say2 = text => { screen.querySelector('#accMsg').textContent = text; };
  screen.querySelector('#regForm').addEventListener('submit', async e => {
    e.preventDefault();
    const u = screen.querySelector('#regUser').value.trim(), p1 = screen.querySelector('#regPass').value, p2 = screen.querySelector('#regPass2').value;
    if (!/^[A-Za-z0-9_.-]{3,16}$/.test(u) || BAD.some(w => u.toLowerCase().includes(w))) return say2(t('accBadUser'));
    if (p1.length < 6 || p1.length > 64) return say2(t('accBadPass'));
    if (p1 !== p2) return say2(t('accMismatch'));
    const me = lbPlayer();
    const r = await accCall({ action: 'register', username: u, password: p1, id: me.id, key: me.key });
    if (!r || !r.ok) return say2(!r ? t('accFail') : r.error === 'username_taken' ? t('accTaken') : r.error === 'already_has_account' ? t('accAlready') : r.error === 'bad_username' ? t('accBadUser') : r.error === 'bad_password' ? t('accBadPass') : t('accFail'));
    try { localStorage.setItem(ACC_KEY, JSON.stringify({ username: r.username })); } catch (err) {}
    if (!save.nick && nickOk(u)) { save.nick = u; await pushScore(true); }
    persist(); await cloudSave(); accountScreen(t('accOk'));
  });
  screen.querySelector('#logForm').addEventListener('submit', async e => {
    e.preventDefault();
    const r = await accCall({ action: 'login', username: screen.querySelector('#logUser').value.trim(), password: screen.querySelector('#logPass').value });
    if (!r || !r.ok) return say2(!r ? t('accFail') : t('accWrong'));
    try {
      localStorage.setItem('light-dash-player', JSON.stringify({ id: r.id, key: r.key }));
      localStorage.setItem(ACC_KEY, JSON.stringify({ username: r.username }));
      const cloud = await accCall({ action: 'load', id: r.id, key: r.key });
      if (cloud && cloud.ok && cloud.data) localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign({}, cloud.data, { updatedAt: cloud.updated })));
      else localStorage.removeItem(SAVE_KEY);
      sessionStorage.setItem('ld-welcome', '1');
    } catch (err) {}
    location.reload();
  });
}

/* =========================================================
   Community levels: publish, browse, play, like
   ========================================================= */
const LV_URL = LB_URL ? LB_URL.replace(/\/api\/leaderboard$/, '/api/levels') : '';
const levelNameOk = n => /^[A-Za-z0-9 _.,!?'-]{2,24}$/.test(n) && /[A-Za-z0-9]/.test(n) && !BAD.some(w => n.toLowerCase().replace(/[^a-z]/g, '').includes(w));
async function levelsCall(body) {
  if (!LV_URL) return null;
  const me = lbPlayer();
  try {
    const r = await fetch(LV_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ id: me.id, key: me.key }, body)) });
    return await r.json();
  } catch (e) { return null; }
}
async function publishLevel(L) {
  const msg = text => { const m = screen.querySelector('#pubMsg'); if (m) m.textContent = text; };
  if (!LV_URL) return msg(t('commOff'));
  if (!save.nick) { msg(t('pubNeedNick')); return setTimeout(() => nickname(createHub), 1200); }
  if (!L.verified) return msg(t('pubNeedCheck'));
  if (!levelNameOk(L.name.trim())) return msg(t('pubBadName'));
  await pushScore(); // make sure this player exists on the server
  const r = await levelsCall({ action: 'publish', level: { name: L.name.trim(), theme: L.theme, speed: L.speed, items: L.items } });
  if (r && r.ok) { L.publishedId = r.levelId; persist(); toast(t('pubOk')); return createHub(); }
  const err = r && r.error;
  msg(err === 'bad_level_name' ? t('pubBadName') : err === 'too_many' ? t('pubTooMany') : err === 'too_fast' ? t('pubTooFast') : err === 'not_player' ? t('pubNeedNick') : t('pubFail'));
}
async function community(sort) {
  state = 'menu'; ED.commSort = sort;
  const head = `<h2>${t('community')}</h2><p class="sub">${t('communitySub')}</p>`;
  if (!LV_URL) { show(`${head}<div class="fact"><b>${t('commOff')}</b></div><div class="row"><button class="btn alt" id="cmBack">${t('back')}</button></div>`); return on('#cmBack', menu); }
  const tabs = `<div class="row tabs"><button class="btn${sort === 'new' ? '' : ' alt'}" data-sort="new">${t('tabNew')}</button><button class="btn${sort === 'top' ? '' : ' alt'}" data-sort="top">${t('tabTop')}</button>
    <button class="btn${sort === 'plays' ? '' : ' alt'}" data-sort="plays">${t('tabPlays')}</button><button class="btn alt" id="cmCreate">+ ${t('create')}</button><button class="btn alt" id="cmBack">${t('back')}</button></div>`;
  const wire = () => { on('[data-sort]', e => community(e.currentTarget.dataset.sort)); on('#cmCreate', createHub); on('#cmBack', menu); };
  show(`${head}${tabs}<p>${t('loading')}</p>`); wire();
  let data = null;
  try { const r = await fetch(`${LV_URL}?sort=${sort}&me=${encodeURIComponent(lbPlayer().id)}`); if (r.ok) data = await r.json(); } catch (e) {}
  if (state !== 'menu' || !screen.querySelector('[data-sort]')) return;
  if (!data || !Array.isArray(data.levels)) { show(`${head}${tabs}<div class="fact"><b>${t('boardErr')}</b></div>`); return wire(); }
  const rows = data.levels.map(L => `<div class="lvrow"><span><span class="nm">${esc(L.name)}</span>
      <span class="d">${t('by')} ${esc(L.authorName || t('anon'))}${L.mine ? ` (${t('yours')})` : ''} · ${esc(themeName(L.theme))} · ${t('speedN')[ED_SPEEDS.indexOf(L.speed)] || ''} · ♥ ${L.likes} · ▶ ${L.plays}</span></span>
      <span class="row"><button class="btn" data-play="${L.id}">${t('play')}</button>${L.mine ? `<button class="btn alt" data-delpub="${L.id}">${t('delPub')}</button>`
        : `<button class="btn alt" data-like="${L.id}" aria-pressed="${!!L.liked}">${L.liked ? '♥' : '♡'} ${L.likes}</button>`}</span></div>`).join('');
  show(`${head}${tabs}<div class="mylv">${rows || `<p>${t('noCommunity')}</p>`}</div>`);
  wire();
  on('[data-play]', e => playCommunity(e.currentTarget.dataset.play, data.levels.find(x => x.id === e.currentTarget.dataset.play)));
  on('[data-like]', async e => {
    const b = e.currentTarget; if (!save.nick) { toast(t('pubNeedNick')); return; }
    await pushScore();
    const r = await levelsCall({ action: 'like', levelId: b.dataset.like });
    if (r && r.ok) { b.textContent = `${r.liked ? '♥' : '♡'} ${r.likes}`; b.setAttribute('aria-pressed', r.liked); }
  });
  on('[data-delpub]', async e => {
    const b = e.currentTarget; if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = t('sure'); return; }
    const r = await levelsCall({ action: 'delete', levelId: b.dataset.delpub });
    if (r && r.ok) { (save.myLevels || []).forEach(x => { if (x.publishedId === b.dataset.delpub) delete x.publishedId; }); persist(); community(sort); }
  });
}
async function playCommunity(id, summary) {
  let r = null;
  try { const res = await fetch(`${LV_URL}?id=${encodeURIComponent(id)}`); if (res.ok) r = await res.json(); } catch (e) {}
  if (!r || !r.level) { toast(t('boardErr')); return; }
  const v = r.level;
  const L = { id: 'c' + v.id, communityId: v.id, name: v.name, theme: v.theme, speed: v.speed, items: v.items, mine: !!(summary && summary.mine), liked: !!(summary && summary.liked) };
  fetch(LV_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'play', levelId: v.id }) }).catch(() => {});
  playCustom(L, false);
}

/* =========================================================
   Music: a small chiptune per world, made on the fly
   ========================================================= */
const MUS = { on: false, timer: 0, step: 0, next: 0, song: null, gain: null, noise: null };
const SONG_KEYS = [0, 3, 5, -2, 7, 2, 4, -4, 9, 1, -5, 6];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicPlay(idx) {
  musicStop();
  if (save.musicOff || demo) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { return; }
  const i = ((idx % 12) + 12) % 12;
  MUS.song = { root: 57 + SONG_KEYS[i], bpm: 112 + (i % 6) * 6, minor: i % 3 === 1 || i === 8, seed: i * 7 + 3 };
  MUS.gain = ac.createGain(); MUS.gain.gain.value = .06; MUS.gain.connect(ac.destination);
  if (!MUS.noise) { const n = Math.floor(ac.sampleRate * .2); MUS.noise = ac.createBuffer(1, n, ac.sampleRate); const d = MUS.noise.getChannelData(0); for (let k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / n); }
  MUS.on = true; MUS.step = 0; MUS.next = ac.currentTime + .08;
  MUS.timer = setInterval(musicTick, 40);
}
function musicStop() {
  MUS.on = false; clearInterval(MUS.timer);
  if (MUS.gain) { const g = MUS.gain; try { g.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 300); } catch (e) {} MUS.gain = null; }
}
function mNote(type, f, t0, dur, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(MUS.gain); o.start(t0); o.stop(t0 + dur + .02);
}
function mHit(t0, dur, vol) { const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = MUS.noise; g.gain.value = vol; s.connect(g); g.connect(MUS.gain); s.start(t0, 0, dur); }
function musicTick() {
  if (!MUS.on || !ac || !MUS.gain) return;
  const S = MUS.song, sp = 60 / S.bpm / 4;
  const scale = S.minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9], third = S.minor ? 3 : 4;
  const prog = S.minor ? [0, 8, 3, 10] : [0, 7, 9, 5];
  while (MUS.next < ac.currentTime + .15) {
    const st = MUS.step, t0 = MUS.next, bar = Math.floor(st / 16) % 4, s16 = st % 16, root = S.root + prog[bar];
    if (s16 % 8 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + .12); g.gain.setValueAtTime(1, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .15); o.connect(g); g.connect(MUS.gain); o.start(t0); o.stop(t0 + .16); }
    if (s16 === 4 || s16 === 12) mHit(t0, .09, .45);
    if (s16 % 2 === 1) mHit(t0, .025, .12);
    if ([0, 3, 6, 8, 11, 14].includes(s16)) mNote('triangle', hz(root - 24), t0, sp * 2.2, .55);
    if (s16 % 2 === 0) mNote('square', hz(root + [0, third, 7, 12][(s16 / 2) % 4]), t0, sp * 1.4, .1);
    const h = hash(S.seed * 131 + (st % 64));
    if (s16 % 2 === 0 && h < .5) mNote('triangle', hz(S.root + 12 + scale[Math.floor(hash(h * 977) * 5)] + (hash(st + S.seed) < .25 ? 12 : 0)), t0, sp * 3, .28);
    MUS.next += sp; MUS.step++;
  }
}

/* =========================================================
   Main loop
   ========================================================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play' || demo) {
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP;
      if (demo || autoPlay) { demoInp = autopilot(); step(STEP, demoInp); } else step(STEP);
      if (run.done) break;
    }
    if (run.p.alive) {
      for (const q of run.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt; }
    } else {
      run.deadT += dt;
      for (const q of run.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt; }
      if (run.deadT > .75) {
        if (endless && !demo) endlessOver();
        else { const best = save.lv[lvl.idx]; if (!demo && best) { const pct = run.p.x / lvl.len * 100; if (pct > (best.best || 0) + .5 && pct > 5 && !save.practice) toast(t('newBest'), `${Math.floor(pct)}%`); best.best = Math.max(best.best || 0, pct); persist(); } newRun(save.practice && !demo); }
      }
    }
    run.particles = run.particles.filter(q => q.life > 0);
    run.flashT = Math.max(0, run.flashT - dt);
    if (run.done) { if (demo) { run = null; newRun(false); } else complete(); }
  }
  if (state === 'editor' && run) { run.p.x = ED.cam + PX; run.time += dt; }
  if (run) render(dt);
  requestAnimationFrame(frame);
}

/* =========================================================
   Input
   ========================================================= */
function press(k, down) {
  if (state === 'intro' && down && (k === 'up')) return go();
  if (state !== 'play') return;
  if (k === 'up') { if (down && !input.up) input.jumpBuf = .12; input.up = down; }
  if (k === 'down') { if (down && !input.down) input.downPressed = true; input.down = down; }
  if (k === 'right' && down) input.dash = true;
  if (k === 'left' && down) input.light = true;
}
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', Space: 'up', ArrowDown: 'down', KeyS: 'down', ArrowRight: 'right', KeyD: 'right', ArrowLeft: 'left', KeyA: 'left' };
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') { e.preventDefault(); return pause(); }
  const k = KEYMAP[e.code]; if (!k) return;
  if (state === 'play' || state === 'intro' || e.code.startsWith('Arrow')) {
    if (screen.hidden || state === 'intro') e.preventDefault();
  }
  if (e.repeat) return;
  press(k, true);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
document.querySelectorAll('.key').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} press(k, true); });
  const up = () => { b.classList.remove('on'); press(k, false); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', e => { if (state === 'play') { e.preventDefault(); press('up', true); } });
cv.addEventListener('pointerup', () => press('up', false));
document.getElementById('bPause').addEventListener('click', pause);
const bSound = document.getElementById('bSound');
bSound.addEventListener('click', () => { save.mute = !save.mute; persist(); bSound.style.opacity = save.mute ? .4 : 1; });
bSound.style.opacity = save.mute ? .4 : 1;
const bMusic = document.getElementById('bMusic');
bMusic.addEventListener('click', () => {
  save.musicOff = !save.musicOff; persist(); bMusic.style.opacity = save.musicOff ? .4 : 1;
  if (save.musicOff) musicStop(); else if (state === 'play') musicPlay(endless ? 5 : lvl.custom ? lvl.custom.theme || 0 : lvl.idx);
});
bMusic.style.opacity = save.musicOff ? .4 : 1;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function applyLang() {
  document.documentElement.lang = save.lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
}

/* Test hook: run a level with the autopilot, without drawing */
window.__lightDash = {
  editor() { return { state, items: ED.L ? ED.L.items.length : -1, cam: ED.cam, tool: ED.tool }; },
  simulateEndless() {
    const keep = { demo, endless, lvl, run, state };
    demo = true; endless = true; run = null; newRun(false);
    let n = 0;
    while (run.p.alive && n < 120 * 300) { step(STEP, autopilot()); n++; }
    const p = run.p, near = lvl.objs.filter(o => Math.abs(o.x - p.x) < 260 && o.t !== 'energy').map(o => o.t + '@' + Math.round(o.x - p.x) + (o.w ? '/' + o.w : '') + (o.top ? '^' + (G - o.top) : ''));
    const res = { m: Math.floor(p.x / 50), y: Math.round(G - p.y), speed: Math.round(run.speed), near: near.join(' ') };
    demo = keep.demo; endless = keep.endless; lvl = keep.lvl; run = keep.run; state = keep.state;
    return res;
  },
  autoplay(v) { autoPlay = !!v; },
  simulate(i, jitter = 0) {
    const keep = { demo, endless, lvl, run, state };
    demo = true; endless = false; lvl = { idx: i }; run = null; newRun(false);
    let n = 0, delay = [];
    while (!run.done && run.p.alive && n < 120 * 200) {
      let a = autopilot();
      if (jitter) { delay.push(a); a = delay.length > jitter ? delay.shift() : {}; }
      step(STEP, a); n++;
    }
    const res = { level: i, done: run.done, x: Math.round(run.p.x), len: lvl.len, pct: Math.round(run.p.x / lvl.len * 100), houses: litCount() + '/' + lvl.houses, facts: lvl.objs.filter(o => o.t === 'fact' && o.got).map(o => o.id).join(','), factsAll: lvl.objs.filter(o => o.t === 'fact').map(o => o.id + '@' + Math.round(o.x) + ',' + (G - o.y)).join(' '), energy: run.energy, sec: (n / 120).toFixed(1) };
    Object.assign(window, {}); demo = keep.demo; endless = keep.endless; lvl = keep.lvl; run = keep.run; state = keep.state;
    return res;
  },
};

applyLang();
startDemo();
menu();
if (/^#lvl=/.test(location.hash)) { const L = parseCode(location.hash.slice(5)); if (L) sharedLevel(L); }
try { if (sessionStorage.getItem('ld-welcome')) { sessionStorage.removeItem('ld-welcome'); toast(t('accWelcome'), accountName()); } } catch (e) {}
setTimeout(() => { cloudSync(); }, 300);
requestAnimationFrame(frame);
})();
